<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IBKR Feeder</title><link rel="stylesheet" href="./styles.css"></head><body><header><h1>IBKR Feeder</h1><p>Local Client Portal market-data monitoring.</p><nav data-main-nav></nav></header><main><div id="error" class="bad"></div><section class="card"><h2>Actions</h2><button onclick="checkAuth()">Check IBKR Auth</button> <button onclick="startRun()">Run feeder once</button> <button onclick="runAsset()">Run selected asset</button> <button onclick="refresh()">Refresh status</button> <button onclick="logs()">Open logs</button><p id="action"></p></section><section class="card"><h2>Filters</h2><div id="filters"></div><p><label>PEA eligible <input id="pea_eligible" type="checkbox"></label> <label>UCITS <input id="ucits" type="checkbox"></label> <label>Symbols <input id="symbols" placeholder="AAPL.US, MSFT.US"></label> <label>Max assets <input id="max_assets" type="number" min="1"></label></p><div id="quick"></div></section><section class="card"><h2>IBKR Gateway</h2><div id="ibkr">Loading…</div></section><section class="card"><h2>SignalMaker main</h2><div id="sm"></div></section><section class="card"><h2>Feeder run</h2><div id="run"></div></section><section class="card"><h2>Active filters</h2><pre id="active"></pre></section><section class="card"><h2>Assets</h2><div id="assets"></div></section><section class="card" id="log-card" hidden><h2>Logs</h2><pre id="logs"></pre></section></main><script>
const choices={asset_type:['STOCK','ETF'],region:['US','EU','FR'],country:['US','FR','DE','NL','GB'],currency:['USD','EUR','GBP'],exchange_code:['US','PA','XETRA','AMS','LSE'],universe:['Stocks US','Stocks Europe','Stocks Euronext Paris','ETF Europe UCITS','ETF PEA','IBKR Imported']},esc=x=>String(x??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
filters.innerHTML=Object.entries(choices).map(([k,v])=>`<label>${k} <select id="${k}"><option value="">All</option>${v.map(x=>`<option>${x}</option>`).join('')}</select></label> `).join('');const quick=[['Run US Stocks',{asset_type:'STOCK',region:'US'}],['Run EU Stocks',{asset_type:'STOCK',region:'EU'}],['Run Euronext Paris Stocks',{asset_type:'STOCK',exchange_code:'PA',universe:'Stocks Euronext Paris'}],['Run ETF PEA',{asset_type:'ETF',pea_eligible:true,universe:'ETF PEA'}],['Run ETF Europe UCITS',{asset_type:'ETF',ucits:true,universe:'ETF Europe UCITS'}],['Run USD Assets',{currency:'USD'}],['Run EUR Assets',{currency:'EUR'}]];document.querySelector('#quick').innerHTML=quick.map((x,i)=>`<button onclick="startRun(${i})">${x[0]}</button>`).join(' ');
async function api(path,body){let r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function selected(){let p={};Object.keys(choices).forEach(k=>{let e=document.querySelector('#'+k);if(e.value)p[k]=e.value});if(pea_eligible.checked)p.pea_eligible=true;if(ucits.checked)p.ucits=true;p.symbols=symbols.value.split(',').map(x=>x.trim()).filter(Boolean);if(max_assets.value)p.max_assets=Number(max_assets.value);return p}async function startRun(i){action.textContent=JSON.stringify(await api('/api/ibkr-feeder/run-once',i===undefined?selected():quick[i][1]));refresh()}async function runAsset(){let symbol=prompt('Configured symbol');if(symbol)action.textContent=JSON.stringify(await api('/api/ibkr-feeder/run-asset',{symbol}))}async function checkAuth(){action.textContent=JSON.stringify(await api('/api/ibkr-feeder/check-auth',{}));refresh()}async function logs(){let p=await api('/api/ibkr-feeder/logs?lines=300');document.querySelector('#log-card').hidden=false;document.querySelector('#logs').textContent=(p.lines||[]).join('\n')}const fields=o=>Object.entries(o||{}).map(([k,v])=>`<p><strong>${esc(k)}</strong>: ${esc(v)}</p>`).join('');async function refresh(){try{let p=await api('/api/ibkr-feeder/status');error.textContent='';ibkr.innerHTML=fields(p.ibkr);if(!p.ibkr.authenticated)ibkr.innerHTML+='<p class="bad">IBKR Gateway is not authenticated. Open https://localhost:5000 and login first.</p>';sm.innerHTML=fields(p.signalmaker);run.innerHTML=fields(p.run);active.textContent=JSON.stringify(p.filters,null,2);let cols=['symbol','provider_symbol','conid','asset_type','currency','exchange_code','region','country','universe','last_fetch_status','last_fetch_at','candles_received','candles_posted','last_error'];assets.innerHTML=`<div class="scroll"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${(p.assets||[]).map(a=>`<tr>${cols.map(c=>`<td>${esc(a[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}catch(e){error.textContent='Monitoring API unavailable: '+e.message}}refresh();setInterval(refresh,5000);
</script></body></html>
