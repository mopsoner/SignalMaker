<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IBKR Feeder</title><link rel="stylesheet" href="./styles.css"></head><body><header><h1>IBKR Feeder</h1><p>Collecte pilotée par univers SignalMaker.</p><nav data-main-nav></nav></header><main><div id="error" class="bad"></div>
<section class="card"><h2>Lancement</h2><label>Univers actif <select id="universe" onchange="refresh()"></select></label> <button id="launch" onclick="startRun()">Lancer le feed de l’univers</button> <button onclick="checkAuth()">Vérifier IBKR</button> <button onclick="refresh()">Actualiser</button> <button onclick="logs()">Consulter les logs</button><p>Timeframes du workflow (lecture seule) : <strong id="timeframes">15m, 1h, 4h</strong></p><p id="action"></p></section>
<section class="card"><h2>Progression par actif</h2><div id="run">Aucun run.</div><div id="assets"></div></section>
<section class="card"><h2>Résumé final</h2><div id="summary">Aucun résumé.</div></section>
<section class="card" id="log-card" hidden><h2>Logs</h2><pre id="logs"></pre></section></main><script>
const esc=x=>String(x??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){let r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let p=await r.json();if(!r.ok)throw Error(p.detail||`${r.status} ${r.statusText}`);return p}
async function loadUniverses(){let p=await api('/api/ibkr-feeder/universes');universe.innerHTML=p.universes.map(x=>`<option>${esc(x)}</option>`).join('');refresh()}
async function startRun(){try{action.textContent=JSON.stringify(await api('/api/ibkr-feeder/run-once',{universe:universe.value}));refresh()}catch(e){error.textContent=e.message}}
async function checkAuth(){action.textContent=JSON.stringify(await api('/api/ibkr-feeder/check-auth',{}))}
async function logs(){let p=await api('/api/ibkr-feeder/logs?lines=300');document.querySelector('#log-card').hidden=false;document.querySelector('#logs').textContent=(p.lines||[]).join('\n')}
const fields=o=>Object.entries(o||{}).map(([k,v])=>`<p><strong>${esc(k)}</strong>: ${esc(Array.isArray(v)?JSON.stringify(v):v)}</p>`).join('');
async function refresh(){if(!universe.value)return;try{let p=await api('/api/ibkr-feeder/status?universe='+encodeURIComponent(universe.value)),r=p.run||{};error.textContent='';run.innerHTML=fields(r);timeframes.textContent=(r.internal_timeframes||['15m','1h','4h']).join(', ');launch.disabled=['running'].includes(r.status);let cols=['symbol','provider_symbol','status','errors'];assets.innerHTML=`<div class="scroll"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${(p.assets||[]).map(a=>`<tr>${cols.map(c=>`<td>${esc(Array.isArray(a[c])?JSON.stringify(a[c]):a[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;summary.innerHTML=`Actifs terminés : ${esc(r.completed_assets)} / ${esc(r.total_assets)} · Lots envoyés : ${esc(r.batches_sent)} · Chandelles acceptées : ${esc(r.candles_accepted)} · Échecs : ${esc((r.errors||[]).length)}`}catch(e){error.textContent=e.message}}
loadUniverses();setInterval(refresh,5000);
</script><script src="./app.js"></script></body></html>
