<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IBKR Feeder</title><link rel="stylesheet" href="./styles.css"></head><body><header><h1>IBKR Feeder</h1><p>Discover contracts, then monitor local Client Portal market data.</p><nav data-main-nav></nav></header><main><div id="error" class="bad"></div><section class="card"><h2>Actions</h2><button onclick="checkAuth()">Check IBKR Auth</button> <button onclick="startRun()">Run feeder once</button> <button onclick="runAsset()">Run selected asset</button> <button onclick="refresh()">Refresh status</button> <button onclick="logs()">Open logs</button><p id="action"></p></section><section class="card"><h2>Filters</h2><div id="filters"></div><p><label>PEA eligible <input id="pea_eligible" type="checkbox"></label> <label>UCITS <input id="ucits" type="checkbox"></label> <label>Symbols <input id="symbols" placeholder="AIR.PA, ASML.AS"></label> <label>Max assets <input id="max_assets" type="number" min="1"></label></p><div id="quick"></div></section><section class="card"><h2>Asset Discovery / Resolve Conids</h2><p><label>Universe <select id="d_universe"><option selected>Europe Stocks</option><option>Europe ETF</option></select></label> <label>Asset type <select id="d_asset_type"><option>STOCK</option><option>ETF</option></select></label> <label>Source <select id="d_source"><option>seed-file</option><option>ibkr-search</option><option>ibkr-scanner</option></select></label></p><p><label>Seed file <select id="d_seed"><option>europe_stocks.csv</option><option>europe_etf.csv</option></select></label> <label>Max assets <input id="d_max" type="number" min="1" value="50"></label> <label>Dry run <input id="d_dry" type="checkbox" checked></label></p><p><button onclick="presetDiscover('stocks')">Discover Europe Stocks</button> <button onclick="presetDiscover('etf')">Discover Europe ETF</button> <button onclick="discoverAssets()">Resolve selected universe</button> <button onclick="saveAssets()">Save assets</button> <button onclick="thenRun()">Then run feeder</button></p><div id="discovery_stats">No discovery run yet.</div><div id="resolver"></div></section><section class="card"><h2>IBKR Gateway</h2><div id="ibkr">Loading…</div></section><section class="card"><h2>SignalMaker main</h2><div id="sm"></div></section><section class="card"><h2>Feeder run</h2><div id="run"></div></section><section class="card"><h2>Active filters</h2><pre id="active"></pre></section><section class="card"><h2>Assets</h2><div id="assets"></div></section><section class="card" id="log-card" hidden><h2>Logs</h2><pre id="logs"></pre></section></main><script>
const presets={stocks:{universe:'Europe Stocks',asset_type:'STOCK',seed:'europe_stocks.csv',region:'EU'},etf:{universe:'Europe ETF',asset_type:'ETF',seed:'europe_etf.csv',region:'EU'}};let discoveryAssets=[],selectedPreset='stocks';function presetDiscover(key){selectedPreset=key;let p=presets[key];d_universe.value=p.universe;d_asset_type.value=p.asset_type;d_seed.value=p.seed;return discoverAssets()}function discoveryBody(){let p={...(presets[selectedPreset]||{}),universe:d_universe.value,asset_type:d_asset_type.value,source:d_source.value,seed_file:'config/asset_universe_seeds/'+d_seed.value,max_assets:Number(d_max.value)||50,dry_run:d_dry.checked};delete p.seed;return p}function resolverTable(p){let rows=[...(p.assets||[]).map(a=>({input_symbol:a.provider_symbol,status:'resolved',...a,exchange:a.ibkr?.selected_exchange,error:''})),...(p.errors||[])],cols=['input_symbol','provider_symbol','status','conid','name','exchange','currency','asset_type','error'];resolver.innerHTML=`<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(a=>`<tr>${cols.map(c=>`<td>${esc(a[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}async function discoverAssets(){try{let p=await api('/api/ibkr-feeder/discover-assets',discoveryBody());discoveryAssets=p.assets||[];discovery_stats.innerHTML=`<strong>Configured:</strong> ${p.configured_assets_before} · <strong>Resolved:</strong> ${p.resolved} · <strong>Failed:</strong> ${p.failed} · <strong>Without conid:</strong> ${discoveryAssets.filter(a=>!a.conid).length} · <strong>Last run:</strong> ${esc(p.last_discovery_run)}<br>${esc((p.notices||[]).join(' '))}`;resolverTable(p)}catch(e){error.textContent='Discovery failed: '+e.message}}async function saveAssets(){let p=await api('/api/ibkr-feeder/save-assets',{assets:discoveryAssets});action.textContent=JSON.stringify(p);refresh()}async function thenRun(){if(discoveryAssets.length)await saveAssets();await startRun()}
const choices={asset_type:['STOCK','ETF'],region:['EU'],country:['FR','DE','NL','GB','CH'],currency:['EUR','GBP','CHF'],exchange_code:['PA','AMS','XETRA','LSE','SWX'],universe:['Europe Stocks','Europe ETF']},esc=x=>String(x??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
filters.innerHTML=Object.entries(choices).map(([k,v])=>`<label>${k} <select id="${k}"><option value="">All</option>${v.map(x=>`<option>${x}</option>`).join('')}</select></label> `).join('');const quick=[['Run Europe Stocks',{universe:'Europe Stocks',asset_type:'STOCK',region:'EU'}],['Run Europe ETF',{universe:'Europe ETF',asset_type:'ETF',region:'EU'}],['Run PEA Eligible',{region:'EU',pea_eligible:true}],['Run PEA Eligible ETF',{asset_type:'ETF',pea_eligible:true,ucits:true}],['Run France Stocks',{asset_type:'STOCK',country:'FR'}],['Run Amsterdam',{exchange_code:'AMS'}],['Run Xetra',{exchange_code:'XETRA'}],['Run London',{exchange_code:'LSE'}],['Run Switzerland',{exchange_code:'SWX'}]];document.querySelector('#quick').innerHTML=quick.map((x,i)=>`<button onclick="startRun(${i})">${x[0]}</button>`).join(' ');
async function api(path,body){let r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function selected(){let p={};Object.keys(choices).forEach(k=>{let e=document.querySelector('#'+k);if(e.value)p[k]=e.value});if(pea_eligible.checked)p.pea_eligible=true;if(ucits.checked)p.ucits=true;p.symbols=symbols.value.split(',').map(x=>x.trim()).filter(Boolean);if(max_assets.value)p.max_assets=Number(max_assets.value);return p}async function startRun(i){action.textContent=JSON.stringify(await api('/api/ibkr-feeder/run-once',i===undefined?selected():quick[i][1]));refresh()}async function runAsset(){let symbol=prompt('Configured symbol');if(symbol)action.textContent=JSON.stringify(await api('/api/ibkr-feeder/run-asset',{symbol}))}async function checkAuth(){action.textContent=JSON.stringify(await api('/api/ibkr-feeder/check-auth',{}));refresh()}async function logs(){let p=await api('/api/ibkr-feeder/logs?lines=300');document.querySelector('#log-card').hidden=false;document.querySelector('#logs').textContent=(p.lines||[]).join('\n')}const fields=o=>Object.entries(o||{}).map(([k,v])=>`<p><strong>${esc(k)}</strong>: ${esc(v)}</p>`).join('');async function refresh(){try{let p=await api('/api/ibkr-feeder/status');error.textContent='';ibkr.innerHTML=fields(p.ibkr);if(!p.ibkr.authenticated)ibkr.innerHTML+='<p class="bad">IBKR Gateway is not authenticated. Open https://localhost:5000 and login first.</p>';sm.innerHTML=fields(p.signalmaker);run.innerHTML=fields(p.run);active.textContent=JSON.stringify(p.filters,null,2);let cols=['symbol','provider_symbol','conid','asset_type','currency','exchange_code','region','country','universe','last_fetch_status','last_fetch_at','candles_received','candles_posted','last_error'];assets.innerHTML=`<div class="scroll"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${(p.assets||[]).map(a=>`<tr>${cols.map(c=>`<td>${esc(a[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}catch(e){error.textContent='Monitoring API unavailable: '+e.message}}refresh();setInterval(refresh,5000);
</script></body></html>
